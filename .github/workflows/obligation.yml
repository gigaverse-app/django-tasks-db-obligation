# gigaverse-app/django-tasks-db-obligation: django-tasks-db's worker checked with a
# pytest-obligation contract in tests/obligation.
# As a canary, the package and its reporting actions intentionally track main.
#
# Two lanes: this fork's own code, and django-tasks-db's current master (its django_tasks_db/
# package checked out over this fork's), nightly and on demand. A change in what any failure
# leaves turns a lane red: that is the signal to report upstream, as a plain issue with a
# standalone reproduction.
# Nightly and on demand, the sync job first merges django-tasks-db's master into the branch, so
# the fork itself stays current and not only what it tests. It keeps this fork's workflow files.
name: Obligation contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync with django-tasks-db master
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the merge
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Merge django-tasks-db's master into ${{ github.ref_name }}
        run: |
          git fetch --no-tags https://github.com/RealOrangeOne/django-tasks-db.git master
          upstream="$(git rev-parse --short FETCH_HEAD)"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already has django-tasks-db master \`$upstream\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-commit --no-ff FETCH_HEAD || true
          # Keep this fork's workflow files as they are. GITHUB_TOKEN may not push a commit that
          # changes one, and django-tasks-db's own CI is disabled here (its full matrix belongs
          # upstream), so its edits to them are left out: this fork's copies are restored and files
          # it adds are dropped.
          git checkout HEAD -- .github/workflows
          git diff --cached --name-only --diff-filter=A HEAD -- .github/workflows | xargs -r git rm -q -f --
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::django-tasks-db's master conflicts with this branch outside .github/workflows; merge it by hand: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            exit 1
          fi
          git commit -q --no-edit -m "Merge django-tasks-db master $upstream"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Merged django-tasks-db master \`$upstream\`, keeping this fork's workflow files." >> "$GITHUB_STEP_SUMMARY"

  contract:
    name: contract (${{ matrix.django-tasks-db }})
    # After the sync, whatever it did; on a push or a pull request there is no sync.
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the report's PR comment on same-repo PRs; a fork PR's token stays read-only
    strategy:
      fail-fast: false
      matrix:
        django-tasks-db: [this-fork, upstream-master]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Nightly and on demand, the branch head after the sync rather than the commit that started the run.
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name || '' }}
      - name: Check out django-tasks-db's current master package
        if: matrix.django-tasks-db == 'upstream-master'
        run: |
          git fetch --no-tags --depth 1 https://github.com/RealOrangeOne/django-tasks-db.git master
          git checkout FETCH_HEAD -- django_tasks_db
          echo "django-tasks-db master: [\`$(git rev-parse --short FETCH_HEAD)\`](https://github.com/RealOrangeOne/django-tasks-db/commit/$(git rev-parse FETCH_HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            tests/obligation/requirements.txt
      - name: Install django-tasks-db and the contract's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev --group postgres -r tests/obligation/requirements.txt
      - name: Run the contract
        id: tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: python -m pytest tests/obligation --due-work-verify --due-work-require-assessed --due-work-profile-report=obligation-profiles.json
      - name: Report what the contract proved
        if: ${{ !cancelled() }}
        uses: gigaverse-app/pytest-obligation/report@main
        with:
          application-paths: tests/obligation
          report-path: obligation-profiles.json
          expected-reports: '1'
          test-outcome: ${{ steps.tests.outcome }}
          sticky-key: django-tasks-db-${{ matrix.django-tasks-db }}

  readme:
    # Keeps the upstream-master lane's report in .github/README.md, the fork's front page, with a
    # badge. It runs no tests: it re-renders the lane's uploaded evidence, so it is the only job
    # that can write.
    name: README report (django-tasks-db master)
    needs: contract
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the README block and the badge when they change
    concurrency:
      group: obligation-readme-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name || '' }}
      - name: Download the upstream-master lane's evidence
        uses: actions/download-artifact@v8
        with:
          name: obligation-django-tasks-db-upstream-master-${{ github.run_attempt }}
          path: evidence
      - name: Read that lane's test outcome
        id: lane
        run: echo "outcome=$(jq -r .test_outcome evidence/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Render the report into the README and the badge
        uses: gigaverse-app/pytest-obligation/report@main
        with:
          application-paths: tests/obligation
          report-path: evidence/reports/*.json
          expected-reports: '1'
          test-outcome: ${{ steps.lane.outputs.outcome }}
          post-comment: 'false'
          sticky-key: django-tasks-db-readme
          readme-path: .github/README.md
          readme-source: nightly run of tests/obligation against django-tasks-db's current master
          badge-path: .github/obligation-badge.json
      - name: Commit them if the evidence changed
        run: |
          git add .github/README.md .github/obligation-badge.json
          if git diff --cached --quiet; then
            echo "The report is unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Update the pytest-obligation report from django-tasks-db master"
          git push origin "HEAD:${GITHUB_REF_NAME}"
